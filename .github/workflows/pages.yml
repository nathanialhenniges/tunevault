name: Deploy docs site
on:
  pull_request:
    paths:
      - "site/**"
      - "docs/privacy-policy.md"
      - "docs/terms-of-use.md"
      - "docs/third-party-notices.md"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/privacy-policy.md"
      - "docs/terms-of-use.md"
      - "docs/third-party-notices.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ["Verify native applications"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: github.event_name != 'pull_request'
      - run: npm ci
      - run: npm run lint
      - run: npm run types:check
      - run: npm run build
        env:
          PAGES_BASE_PATH: /tunevault
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
        with:
          path: site/out
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
